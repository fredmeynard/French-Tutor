    .btn--secondary {

      border: 1px solid var(--color-border);

    .btn--secondary:hover:not(:disabled) {

    .toggle-switch:hover {

    .toggle-switch__track {

      width: 32px;
      height: 18px;
      background: #ccc;
      border-radius: 9px;
      transition: background 0.2s;
      flex-shrink: 0;

    .toggle-switch__thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    .toggle-switch.active .toggle-switch__track {
      background: var(--color-accent);
    }

    .toggle-switch.active .toggle-switch__thumb {
      transform: translateX(14px);
    }

    .main-content {

    .modal-overlay.visible {

      pointer-events: auto;
    }

    .modal {
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      width: 420px;
      max-width: 90vw;
      padding: 0;
      overflow: hidden;
      transform: scale(0.95);
      transition: transform 0.2s ease;
    }

    .modal-overlay.visible .modal {
      transform: scale(1);
    }

    .modal__header {
      padding: 20px 24px 0;
    }

    .modal__title {
      font-size: 16px;
      font-weight: 600;
      color: var(--color-text);
      margin: 0;
    }

    .modal__body {
      padding: 12px 24px 24px;
      font-size: 13px;
      color: var(--color-text-secondary);
      line-height: 1.6;
    }

    .modal__footer {
      padding: 0 24px 20px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* ---------- Loading skeleton (for initial page load) ---------- */
    .skeleton-container {
      position: fixed;
      inset: 0;
      background: var(--color-bg);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 1;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .skeleton-container.hidden {

    }

    .skeleton-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--color-border);
      border-top-color: var(--color-accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ---------- Figma frame / preview wrapper ---------- */
    .figma-frame-wrapper {
      width: 100%;

      position: relative;
      border-radius: 5px;

        display: none;

        max-width: 140px;
      }
      .btn--secondary {
        display: none;
      }
    }
  </style>
</head>

      'use strict';

      // ---- Theme preference (kept from original) ----
      var themePreference = localStorage.getItem('global-debug-theme-preference') || 'system';
      var theme;
      if (themePreference === 'dark') {
        theme = 'dark';
      } else if (themePreference === 'system') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } else {
        theme = 'light';
      }
      document.body.dataset.preferredTheme = theme;

      // ---- Hide loading skeleton & show app ----
      function showApp() {
        var skeleton = document.getElementById('loading-skeleton');
        var app = document.getElementById('app');
        if (skeleton) {
          skeleton.classList.add('hidden');
          setTimeout(function () { skeleton.style.display = 'none'; }, 400);
        }
        if (app) {
          app.style.display = 'flex';
        }
      }

      // Simulate short loading (replace with actual readiness check)
      setTimeout(showApp, 300);

      // ---- Comments toggle ----
      var toggleComments = document.getElementById('toggle-comments');
      if (toggleComments) {
        toggleComments.addEventListener('click', function () {
          this.classList.toggle('active');
          var isActive = this.classList.contains('active');
          this.setAttribute('aria-label', isActive ? 'Hide comments' : 'Show comments');
        });
      }

      // ---- Right panel toggle (example: share button opens panel) ----
      var rightPanel = document.getElementById('right-panel');
      var shareBtn = document.getElementById('btn-share');
      if (shareBtn && rightPanel) {
        shareBtn.addEventListener('click', function () {
          var isOpen = rightPanel.classList.toggle('open');
          rightPanel.setAttribute('aria-hidden', !isOpen);
        });
      }

      // ---- Modal: Reload to continue ----
      var modal = document.getElementById('modal-reload');
      var saveReloadBtn = document.getElementById('btn-save-reload');

      // Show modal after a short delay (simulating outdated version)
      setTimeout(function () {
        if (modal) modal.classList.add('visible');
      }, 1500);

      if (saveReloadBtn) {
        saveReloadBtn.addEventListener('click', function () {
          // In a real app, this would save & reload
          if (modal) modal.classList.remove('visible');
          // Simulate reload
          window.location.reload();
        });
      }

      // Close modal on overlay click (optional)
      if (modal) {
        modal.addEventListener('click', function (e) {
          if (e.target === modal) {
            modal.classList.remove('visible');
          }
        });
      }

      // ---- Back button ----
      var backBtn = document.getElementById('btn-back');
      if (backBtn) {
        backBtn.addEventListener('click', function () {
          if (window.history.length > 1) {
            window.history.back();
          } else {
            window.location.href = 'https://www.figma.com/files';
          }
        });
      }

      // ---- File name editable ----
      var fileNameBtn = document.getElementById('file-name');
      if (fileNameBtn) {
        fileNameBtn.addEventListener('click', function () {
          var currentName = this.textContent.trim();
          var input = document.createElement('input');
          input.type = 'text';
          input.value = currentName;
          input.className = 'file-name';
          input.style.width = '200px';
          input.style.border = '1px solid var(--color-accent)';
          input.style.outline = 'none';
          input.style.background = 'white';

          var parent = this.parentNode;
          parent.replaceChild(input, this);
          input.focus();
          input.select();

          function finishEdit() {
            var newName = input.value.trim() || currentName;
            var newBtn = document.createElement('button');
            newBtn.id = 'file-name';
            newBtn.className = 'file-name';
            newBtn.title = newName;
            newBtn.textContent = newName;
            parent.replaceChild(newBtn, input);
            // Re-attach event listener
            newBtn.addEventListener('click', arguments.callee);
          }

          input.addEventListener('blur', finishEdit);
          input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
              input.blur();
            } else if (e.key === 'Escape') {
              input.value = currentName;
              input.blur();
            }
          });
        });
      }

      // ---- Copy design button (placeholder) ----
      var copyDesignBtn = document.getElementById('btn-copy-design');

      // ---- Expose some globals for debugging ----

        openModal: function () { if (modal) modal.classList.add('visible'); },
        closeModal: function () { if (modal) modal.classList.remove('visible'); },

            var isOpen = rightPanel.classList.toggle('open');
            rightPanel.setAttribute('aria-hidden', !isOpen);
            return isOpen;
          }
          return false;
        }
      };
    })();
